 <title>M-PESA Payment</title>

<body>
  <div class="container">
    <img src="https://cdn-icons-png.flaticon.com/512/684/684809.png" alt="phone icon">
    <h2>M-Pesa Payment</h2>
    <p>Enter your M-Pesa number and amount to receive an STK push</p>
    <script>
  async function makePayment() {
    const phone = document.getElementById("mpesa").value.trim();
    const amount = document.getElementById("amount").value.trim();
    const responseBox = document.getElementById("response");

    if (!phone || !amount) {
      responseBox.innerText = "⚠️ Please enter phone and amount.";
      return;
    }

    try {
      const res = await fetch("http://localhost:3000/stkpush", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ phone, amount })
      });

      const data = await res.json();
      console.log(data);

      if (data.errorMessage) {
        responseBox.innerText = "❌ " + data.errorMessage;
      } else {
        responseBox.innerText = "✅ Check your phone for STK push!";
      }
    } catch (err) {
      responseBox.innerText = "❌ Error: " + err.message;
    }
  }
</script>



    <form onsubmit="makePayment(); return false;"></form>
        <input type="text" id="phone" placeholder="Enter Phone (2547...)" required>
       <input type="number" id="amount" placeholder="Enter Amount" required>

<script>
  async function makePayment() {
    const phone = document.getElementById("phone").value;
    const amount = document.getElementById("amount").value;
    const responseBox = document.getElementById("response");

    if (!phone || !amount) {
      responseBox.textContent = "⚠️ Please fill in all fields.";
      return;
    }

    try {
      const res = await fetch("http://localhost:3000/stkpush", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ phone, amount })
      });

      const data = await res.json();
      console.log(data);
      responseBox.textContent = "✅ STK Push request sent. Check your phone!";
    } catch (error) {
      console.error(error);
      responseBox.textContent = "❌ Error sending request.";
    }
  }
</script>
